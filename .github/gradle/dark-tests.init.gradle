import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.logging.TestExceptionFormat

allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 1
        forkEvery = 20
        maxHeapSize = "2g"
        testLogging.exceptionFormat = TestExceptionFormat.FULL
    }
}
