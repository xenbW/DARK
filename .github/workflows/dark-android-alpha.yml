name: DARK Android alpha

on:
  push:
    branches: [feat/dark-phase2]
    tags: ['dark-release-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xenbW/DARK' && github.ref == 'refs/heads/feat/dark-phase2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve DARK version
        id: metadata
        run: |
          DARK_TAG=$(cat .github/dark-alpha-tag.txt)
          python3 .github/scripts/dark_android_release.py metadata \
            --tag "$DARK_TAG" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s .github/tests -p test_dark_android_release.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore original DARK signing key
        env:
          DARK_DEBUG_KEYSTORE_BASE64: ${{ secrets.DARK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get("DARK_DEBUG_KEYSTORE_BASE64", "").strip()
          if not value:
              raise SystemExit("::error::Set repository Actions secret DARK_DEBUG_KEYSTORE_BASE64 to the original DARK debug keystore. No new signing key will be generated.")
          target = Path(os.environ["RUNNER_TEMP"]) / "dark-debug.keystore"
          target.write_bytes(base64.b64decode(value, validate=True))
          target.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"DARK_DEBUG_KEYSTORE_PATH={target}\n")
          PY
          python3 .github/scripts/dark_android_release.py verify-keystore "$RUNNER_TEMP/dark-debug.keystore"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android toolchains
        run: |
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0' \
            'ndk;30.0.16248370' 'cmake;4.1.2'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-disabled: true

      - name: Build DARK APK
        env:
          DARK_VERSION: ${{ steps.metadata.outputs.version }}
          DARK_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          ./gradlew :androidApp:assembleDebug :androidApp:lintDebug :androidApp:ktlintCheck :shared:ktlintCommonMainSourceSetCheck \
            --no-daemon --no-scan --no-configuration-cache --max-workers=2 \
            "-PappVersion=$DARK_VERSION" "-PdarkVersionCode=$DARK_VERSION_CODE" \
            "-PdarkDebugKeystore=$DARK_DEBUG_KEYSTORE_PATH"

      - name: Run Android and shared unit tests
        env:
          DARK_VERSION: ${{ steps.metadata.outputs.version }}
          DARK_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          ./gradlew :androidApp:testDebugUnitTest :shared:testAndroidHostTest \
            --init-script .github/gradle/dark-tests.init.gradle \
            --no-daemon --no-scan --no-configuration-cache --no-parallel --max-workers=2 \
            "-PappVersion=$DARK_VERSION" "-PdarkVersionCode=$DARK_VERSION_CODE" \
            "-PdarkDebugKeystore=$DARK_DEBUG_KEYSTORE_PATH"

      - name: Verify APK and collect distribution files
        env:
          DARK_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 .github/scripts/dark_android_release.py package \
            --apk androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --sdk "$ANDROID_HOME" --tag "$DARK_TAG" --run-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dark-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dark-debug.keystore"

  upgrade-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dark-android
          path: dist
      - name: Obtain the original installed alpha
        run: |
          curl -fsSL --retry 3 \
            https://github.com/xenbW/DARK/releases/download/v0.1.0-alpha/DARK-v0.1.0-alpha.apk -o previous.apk
          echo 'c62e68c9a5fa56d785e68ce07de410415224d5b167af7e1b62b12bbd35e1b562  previous.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install previous.apk
            adb shell run-as io.github.xenbw.dark.debug mkdir -p files
            adb shell run-as io.github.xenbw.dark.debug sh -c '"echo retained > files/dark_upgrade_probe"'
            adb install -r dist/DARK-*.apk
            test "$(adb shell run-as io.github.xenbw.dark.debug cat files/dark_upgrade_probe | tr -d '\r')" = retained
            adb shell dumpsys package io.github.xenbw.dark.debug | grep versionCode

  publish:
    if: startsWith(github.ref, 'refs/tags/dark-release-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Find a fully verified build of this commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dark-android-alpha.yml/runs" \
            --method GET -f head_sha="$GITHUB_SHA" -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_branch == "feat/dark-phase2")][0].id // empty')
          test -n "$run_id" || { echo "No successful phase-2 verification run for this commit" >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            --jq '[.jobs[] | select(.name == "upgrade-compatibility" and .conclusion == "success")] | length')" = 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dark-android
          path: dist
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Validate verified build provenance and checksum
        run: |
          DARK_TAG=${GITHUB_REF_NAME#dark-release-}
          echo "DARK_TAG=$DARK_TAG" >> "$GITHUB_ENV"
          export DARK_TAG
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path(f"dist/DARK-{os.environ['DARK_TAG']}-build.json").read_text())
          assert record["commit"] == os.environ["GITHUB_SHA"]
          assert record["tag"] == os.environ["DARK_TAG"]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_RUN_NUMBER={record['run_number']}\n")
              f.write(f"SOURCE_RUN_URL={record['workflow_run']}\n")
              f.write(f"DARK_VERSION_CODE={record['version_code']}\n")
          PY
          cd dist
          sha256sum -c "DARK-$DARK_TAG.apk.sha256"
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "DARK-$DARK_TAG.apk.sha256"
          if gh release view "$DARK_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            test "$(gh release view "$DARK_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            gh release edit "$DARK_TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false
          else
            gh release create "$DARK_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DARK $DARK_TAG" --draft --prerelease --latest=false
          fi
          gh release upload "$DARK_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$DARK_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "DARK-$DARK_TAG.apk" --dir ../download-verification
          cmp "DARK-$DARK_TAG.apk" "../download-verification/DARK-$DARK_TAG.apk"
          cat > ../release-notes.md <<EOF
          DARK $DARK_TAG para Android 7.0 o posterior. APK de pruebas con paquete io.github.xenbw.dark.debug y versionCode $DARK_VERSION_CODE.

          Compilado y firmado por GitHub Actions con el certificado del APK original de DARK. Conserva la licencia GPLv3 y los créditos de Metrolist. La validación incluye compilación, firma, identidad del APK, lint, ktlint, pruebas Android y compartidas, e instalación sobre v0.1.0-alpha en un emulador. No sustituye pruebas visuales en dispositivos Samsung.

          Código de esta compilación: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          Archivo de fuentes de esta revisión: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.zip
          Compilación y pruebas: $SOURCE_RUN_URL
          Publicación: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Los archivos adjuntos incluyen el SHA-256 del APK y los datos de la compilación. Las etiquetas existentes no se mueven; el enlace al commit de esta compilación identifica el código exacto del APK.
          EOF
          gh release edit "$DARK_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false --notes-file ../release-notes.md
          echo "APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$DARK_TAG/DARK-$DARK_TAG.apk" >> "$GITHUB_STEP_SUMMARY"
